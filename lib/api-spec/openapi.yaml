openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: planning
    description: Gemini-powered deadline planning
paths:
  /design-suggestions:
    post:
      operationId: generateDesignSuggestions
      tags: [planning]
      summary: Suggest three lock-screen styles from a brief and optional reference image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignBrief"
      responses:
        "200":
          description: Gemini-inspired editable styles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignSuggestions"
        "400":
          description: Invalid style brief or reference image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Reference image is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many style requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Gemini could not suggest usable designs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /plan:
    post:
      operationId: generatePlan
      tags: [planning]
      summary: Generate a deadline milestone plan
      description: Uses Gemini to create a practical, deadline-aware milestone roadmap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "200":
          description: Generated milestone plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "400":
          description: Invalid deadline planning request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Gemini planning is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    DesignBrief:
      type: object
      required: [goal, prompt, format, milestones]
      properties:
        goal:
          type: string
          minLength: 1
          maxLength: 120
        prompt:
          type: string
          maxLength: 1200
        format:
          type: string
          enum: [phone, desktop, custom, cover]
        milestones:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/DesignCheckpoint"
        referenceImage:
          $ref: "#/components/schemas/DesignReference"
    DesignCheckpoint:
      type: object
      required: [title, tMinus]
      properties:
        title:
          type: string
          maxLength: 200
        tMinus:
          type: string
          maxLength: 40
    DesignReference:
      type: object
      required: [mimeType, data]
      properties:
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        data:
          type: string
          minLength: 4
          maxLength: 2000000
          pattern: '^[A-Za-z0-9+/]+={0,2}$'
    DesignSuggestions:
      type: object
      required: [inspiration, options]
      properties:
        inspiration:
          type: string
          minLength: 1
          maxLength: 600
        options:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/DesignSuggestion"
    DesignSuggestion:
      type: object
      required: [name, rationale, template, background, accentColor, textColor, backgroundStyle, font, layout, title]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        rationale:
          type: string
          minLength: 1
          maxLength: 240
        template:
          type: string
          enum: [solstice, mono, night, orbit, paper, signal, field, dawn]
        background:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        accentColor:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        textColor:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        backgroundStyle:
          type: string
          enum: [solid, gradient]
        font:
          type: string
          enum: [Fraunces, DM Sans, DM Mono]
        layout:
          type: string
          enum: [left, center, right]
        title:
          type: string
          minLength: 1
          maxLength: 80
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    PlanInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        deadline:
          type: string
          format: date-time
        availableHoursPerDay:
          type: number
          minimum: 0.25
          maximum: 24
        unavailableDays:
          type: array
          items:
            type: string
            enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
        started:
          type: boolean
        remainingTasks:
          type: string
          maxLength: 3000
        timezone:
          type: string
      required:
        - title
        - description
        - deadline
        - availableHoursPerDay
        - unavailableDays
        - started
        - remainingTasks
        - timezone
    PlanTask:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        completed:
          type: boolean
      required: [id, title, completed]
    PlanMilestone:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        tMinus:
          type: string
        date:
          type: string
          format: date
        description:
          type: string
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/PlanTask"
        priority:
          type: string
          enum: [low, medium, high]
        completed:
          type: boolean
      required: [id, title, tMinus, date, description, tasks, priority, completed]
    PlanResponse:
      type: object
      properties:
        summary:
          type: string
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/PlanMilestone"
      required: [summary, milestones]

